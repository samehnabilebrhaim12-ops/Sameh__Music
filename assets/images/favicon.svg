<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Circle with border glow -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Music Soundwaves / Aura Rings -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.3" />

  <!-- Studio Microphone Graphic -->
  <!-- Mic Capsule -->
  <rect x="42" y="24" width="16" height="26" rx="8" fill="#ffffff" />
  
  <!-- Mic Grille Line Accent -->
  <line x1="42" y1="36" x2="58" y2="36" stroke="#ff2a85" stroke-width="2" />
  
  <!-- Mic Arc Holder -->
  <path d="M 35 38 C 35 52, 65 52, 65 38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Mic Stem -->
  <line x1="50" y1="52" x2="50" y2="66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Mic Base Stand -->
  <line x1="38" y1="66" x2="62" y2="66" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Floating Golden Music Note -->
  <g fill="url(#goldGrad)" transform="translate(62, 18) scale(0.9)">
    <circle cx="4" cy="14" r="3.5" />
    <path d="M 7 14 L 7 2 C 7 2, 14 0, 16 6 L 16 8 C 13 4, 9 4, 9 5 L 9 14 Z" />
  </g>
  
  <!-- Sparkle Star -->
  <path d="M 24 22 Q 24 28 30 28 Q 24 28 24 34 Q 24 28 18 28 Q 24 28 24 22 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>
